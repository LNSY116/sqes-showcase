<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img"><title>SQES 公開展示示意</title><style>text {font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;}</style><rect x="0" y="0" width="1200" height="840" rx="0" fill="#edf3f8"/><rect x="0" y="0" width="1200" height="96" rx="0" fill="#102a43"/><text x="34" y="42" font-size="25" fill="#ffffff" font-weight="700">SQES  /  品質評鑑工作台</text><text x="34" y="72" font-size="16" fill="#c6d8e7" font-weight="400">公開展示示意 · 人工編造資料 · 非實際介面截圖</text><rect x="32" y="120" width="360" height="128" rx="12" fill="#ffffff"/><text x="54" y="151" font-size="17" fill="#506780" font-weight="400">示意場次</text><text x="54" y="197" font-size="38" fill="#155e75" font-weight="700">6</text><text x="122" y="196" font-size="15" fill="#506780" font-weight="400">全部案例均為虛構</text><rect x="420" y="120" width="360" height="128" rx="12" fill="#ffffff"/><text x="442" y="151" font-size="17" fill="#506780" font-weight="400">複核完成</text><text x="442" y="197" font-size="38" fill="#155e75" font-weight="700">4</text><text x="510" y="196" font-size="15" fill="#506780" font-weight="400">僅示意流程狀態</text><rect x="808" y="120" width="360" height="128" rx="12" fill="#ffffff"/><text x="830" y="151" font-size="17" fill="#506780" font-weight="400">待複核</text><text x="830" y="197" font-size="38" fill="#155e75" font-weight="700">2</text><text x="898" y="196" font-size="15" fill="#506780" font-weight="400">不列入正式排名</text><rect x="32" y="272" width="1136" height="426" rx="12" fill="#ffffff"/><text x="54" y="310" font-size="23" fill="#18324d" font-weight="700">場次檢視</text><text x="54" y="340" font-size="16" fill="#506780" font-weight="400">分數僅供示意，不代表實際配分、AI 準確率或成交機率。</text><text x="54" y="382" font-size="16" fill="#506780" font-weight="600">案例</text><text x="225" y="382" font-size="16" fill="#506780" font-weight="600">顧問</text><text x="426" y="382" font-size="16" fill="#506780" font-weight="600">複核狀態</text><text x="604" y="382" font-s