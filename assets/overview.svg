<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img"><title>SQES 公開展示示意</title><style>text {font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;}</style><rect x="0" y="0" width="1200" height="390" rx="0" fill="#102a43"/><rect x="42" y="34" width="62" height="5" rx="2" fill="#66d9c7"/><text x="42" y="88" font-size="42" fill="#ffffff" font-weight="700">SQES</text><text x="42" y="130" font-size="28" fill="#ffffff" font-weight="700">銷售品質評鑑系統</text><text x="42" y="170" font-size="21" fill="#c6d8e7" font-weight="400">讓銷售對話成為可追溯、可複核的品質資訊</text><text x="42" y="211" font-size="14" fill="#8db6cf" font-weight="600">SALES QUALITY EVALUATION SYSTEM</text><rect x="42" y="258" width="250" height="92" rx="12" fill="#1c3e59"/><text x="60" y="292" font-size="21" fill="#ffffff" font-weight="600">語音與逐字稿</text><text x="60" y="324" font-size="16" fill="#c6d8e7" font-weight="400">保留對話依據</text><text x="304" y="310" font-size="22" fill="#66d9c7" font-weight="400">→</text><rect x="330" y="258" width="250" height="92" rx="12" fill="#1c3e59"/><text x="348" y="292" font-size="21" fill="#ffffff" font-weight="600">AI 輔助分析</text><text x="348" y="324" font-size="16" fill="#c6d8e7" font-weight="400">整理品質與意向</text><text x="592" y="310" font-size="22" fill="#66d9c7" font-weight="400">→</text><rect x="618" y="258" width="250" height="92" rx="12" fill="#1c3e59"/><text x="636" y="292" font-size="21" fill="#ffffff" font-weight="600">人工複核</text><text x="636" y="324" font-size="16" fill="#c6d8e7" font-weight="400">確認判讀結果</text><text x="880" y="310" font-size="22" fill="#66d9c7" font-weight="400">→</text><rect x="906" y="258" width="250" height="92" rx="12" fill="#1c3e59"/><text x="924" y="292" font-size="21" fill="#ffffff" font-weight="600">數據可視化</text><text x="924" y="324" font-size="16" fill="#c6d8e7" font-weight="400">支援主管檢視</text></svg>
